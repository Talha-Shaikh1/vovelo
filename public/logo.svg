<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5132" />
      <stop offset="100%" stop-color="#082A1A" />
    </linearGradient>
  </defs>

  <!-- Luxury Monogram Icon (V Geometric Crest) -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#emeraldGrad)" />
    <!-- Outer gold diamond border -->
    <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />
    
    <!-- Stylized Monogram V -->
    <path d="M18 20 L32 46 L46 20 L39 20 L32 35 L25 20 Z" fill="url(#goldGrad)" />
    <!-- Central diamond star accent -->
    <polygon points="32,22 34,26 38,26 35,29 36,33 32,30 28,33 29,29 26,26 30,26" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography Brandmark -->
  <g transform="translate(90, 42)">
    <!-- Brand Wordmark -->
    <text x="0" y="0" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Bodoni MT', 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="0.22em" fill="#111111">
      VOVELO
    </text>
    <!-- Subtitle / Niche Indicator -->
    <text x="2" y="19" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.32em" fill="#0F5132">
      HAUTE COUTURE &amp; LUXURY ARCHIVE
    </text>
  </g>
</svg>
